databases:
  - name: ed1-logistica-db
    databaseName: ed1_logistica
    user: ed1_app
    plan: 0.1c-256mb
services:
  - type: web
    name: ed1-logistica
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python start_render.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ed1-logistica-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLET_SECRET_KEY
        generateValue: true
      - key: ADMIN_BOOTSTRAP_ORG
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
