[project]
name = "ed1-logistica-vercel"
version = "3.0.0"
description = "Portal logistico FastAPI + PostgreSQL, listo para Vercel y localhost"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<3.4", "argon2-cffi>=23.1,<26",
  "itsdangerous>=2.2,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "main:app"
